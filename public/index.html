<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="BY OMITO — historias, perfiles y momentos de la cultura AFTER."
    />
    <meta name="theme-color" content="#09090b" />
    <title>BY OMITO — AFTER</title>
    <style>
      :root {
        --black: #09090b;
        --surface: #121218;
        --surface-soft: #181820;
        --white: #fafafa;
        --muted: #a1a1aa;
        --border: #2c2c38;
        --purple: #a855f7;
        --purple-soft: #d8b4fe;
        --purple-deep: #581c87;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--white);
        background:
          radial-gradient(circle at 90% 0%, rgba(168, 85, 247, .2), transparent 27rem),
          radial-gradient(circle at 0% 40%, rgba(126, 34, 206, .12), transparent 24rem),
          var(--black);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
        outline: 3px solid rgba(216, 180, 254, .65);
        outline-offset: 3px;
      }
      .shell { width: min(100%, 1080px); margin: 0 auto; padding: 18px 16px 90px; }
      .topbar {
        position: sticky; top: 14px; z-index: 10;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 13px 15px; border: 1px solid var(--border); border-radius: 18px;
        background: rgba(9, 9, 11, .86); backdrop-filter: blur(18px);
      }
      .brand { color: var(--white); font-size: 1.2rem; font-weight: 900; letter-spacing: .17em; text-decoration: none; }
      .brand span { color: var(--purple-soft); }
      .nav { display: flex; gap: 6px; overflow-x: auto; }
      .filter {
        border: 1px solid transparent; border-radius: 10px; padding: 8px 10px;
        color: var(--muted); background: transparent; font-size: .75rem; font-weight: 800; letter-spacing: .06em;
      }
      .filter[aria-pressed="true"] { color: var(--white); border-color: var(--purple); background: rgba(168, 85, 247, .14); }
      .hero { padding: clamp(38px, 8vw, 76px) 8px 34px; }
      .eyebrow { margin: 0 0 12px; color: var(--purple-soft); font-size: .75rem; font-weight: 800; letter-spacing: .16em; }
      h1 { max-width: 720px; margin: 0; font-size: clamp(2.65rem, 9vw, 5.8rem); line-height: .94; letter-spacing: -.065em; }
      h1 em { color: var(--purple-soft); font-style: normal; }
      .hero-copy { max-width: 575px; margin: 20px 0 0; color: #d4d4d8; font-size: 1.05rem; line-height: 1.65; }
      .toolbar { display: flex; gap: 10px; margin: 10px 0 20px; }
      .search {
        min-width: 0; flex: 1; padding: 13px 14px; border: 1px solid var(--border); border-radius: 13px;
        color: var(--white); background: rgba(18, 18, 24, .88);
      }
      .search::placeholder { color: #71717a; }
      .primary {
        border: 1px solid var(--purple); border-radius: 13px; padding: 12px 16px;
        color: #fff; background: linear-gradient(135deg, #9333ea, #7e22ce); font-weight: 800;
        box-shadow: 0 10px 28px rgba(126, 34, 206, .24);
      }
      .primary:hover { filter: brightness(1.12); }
      .feed { display: grid; gap: 13px; }
      .card {
        padding: clamp(19px, 4vw, 27px); border: 1px solid var(--border); border-radius: 20px;
        background: linear-gradient(135deg, rgba(255, 255, 255, .035), transparent 42%), var(--surface);
      }
      .card-head { display: flex; align-items: center; gap: 12px; }
      .avatar {
        display: grid; width: 42px; height: 42px; place-items: center; border-radius: 50%;
        color: var(--purple-soft); background: linear-gradient(135deg, #2e1065, #581c87); font-weight: 900;
      }
      .post-type { margin: 0; color: var(--muted); font-size: .78rem; }
      .post-title { margin: 18px 0 9px; font-size: clamp(1.28rem, 3vw, 1.65rem); letter-spacing: -.025em; }
      .post-body { margin: 0; color: #dedee5; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
      .stats { display: flex; gap: 10px; margin-top: 21px; padding-top: 14px; border-top: 1px solid var(--border); }
      .action {
        border: 0; border-radius: 9px; padding: 7px 9px; color: var(--muted); background: transparent; font-size: .9rem; font-weight: 750;
      }
      .action:hover, .action[aria-expanded="true"] { color: var(--purple-soft); background: rgba(168, 85, 247, .1); }
      .action.liked { color: var(--purple-soft); }
      .comment-box { display: none; gap: 11px; margin-top: 14px; }
      .comment-box.open { display: grid; }
      .comments { display: grid; gap: 8px; }
      .comment { padding: 10px 12px; border-left: 2px solid var(--purple); border-radius: 8px; background: var(--surface-soft); }
      .comment-meta { color: var(--purple-soft); font-size: .78rem; font-weight: 800; }
      .comment-time { color: var(--muted); font-weight: 500; }
      .comment-text { margin: 5px 0 0; color: #dedee5; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
      .comment-row { display: flex; gap: 8px; }
      .comment-input, .field {
        width: 100%; min-width: 0; padding: 12px; border: 1px solid var(--border); border-radius: 11px;
        color: var(--white); background: #0d0d12; resize: vertical;
      }
      .secondary {
        border: 1px solid var(--border); border-radius: 11px; padding: 0 14px; color: var(--white); background: var(--surface-soft); font-weight: 800;
      }
      .empty { padding: 44px 20px; border: 1px dashed var(--border); border-radius: 18px; color: var(--muted); text-align: center; }
      .modal {
        position: fixed; inset: 0; z-index: 30; display: none; align-items: end; justify-content: center;
        padding: 16px; background: rgba(0, 0, 0, .72);
      }
      .modal.open { display: flex; }
      .dialog {
        width: min(100%, 620px); max-height: min(720px, calc(100dvh - 32px)); overflow: auto; padding: 22px;
        border: 1px solid #5b21b6; border-radius: 22px; background: var(--surface);
        box-shadow: 0 -20px 70px rgba(0, 0, 0, .45);
      }
      .dialog h2 { margin: 0 0 6px; font-size: 1.55rem; }
      .dialog > p { margin: 0 0 20px; color: var(--muted); }
      .field-label { display: grid; gap: 7px; margin: 14px 0; color: #e4e4e7; font-size: .9rem; font-weight: 750; }
      .field { margin-top: 0; }
      .field:focus { border-color: var(--purple); }
      textarea.field { min-height: 145px; }
      .dialog-actions { display: flex; justify-content: end; gap: 9px; margin-top: 18px; }
      .ghost { border: 1px solid var(--border); border-radius: 11px; padding: 11px 15px; color: #d4d4d8; background: transparent; font-weight: 750; }
      .toast {
        position: fixed; top: 24px; left: 50%; z-index: 50; max-width: calc(100% - 32px);
        transform: translate(-50%, -12px); opacity: 0; pointer-events: none; transition: .18s ease;
        padding: 12px 15px; border: 1px solid var(--purple); border-radius: 12px; color: var(--white); background: #2e1065;
      }
      .toast.show { transform: translate(-50%, 0); opacity: 1; }
      .footer { padding: 38px 4px 0; color: #71717a; font-size: .82rem; text-align: center; }
      .footer strong { color: var(--purple-soft); letter-spacing: .09em; }
      @media (max-width: 620px) {
        .shell { padding: 12px 12px 70px; }
        .topbar { top: 8px; align-items: flex-start; flex-direction: column; }
        .nav { width: 100%; }
        .toolbar { align-items: stretch; flex-direction: column; }
        .primary { min-height: 48px; }
        .comment-row { align-items: stretch; flex-direction: column; }
        .secondary { min-height: 42px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="BY OMITO, inicio">BY <span>OMITO</span></a>
        <nav class="nav" aria-label="Filtrar publicaciones">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">TODO</button>
          <button class="filter" type="button" data-filter="influencer" aria-pressed="false">INFLUENCERS</button>
          <button class="filter" type="button" data-filter="bartender" aria-pressed="false">BARTENDERS</button>
        </nav>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <p class="eyebrow">CULTURA · NOCHE · COMUNIDAD</p>
          <h1 id="page-title">Lo que pasa <em>AFTER</em> merece contarse.</h1>
          <p class="hero-copy">BY OMITO reúne las historias, las personas y los momentos que mueven la noche.</p>
        </section>

        <section aria-label="Publicaciones">
          <div class="toolbar">
            <input id="search" class="search" type="search" placeholder="Buscar historias…" aria-label="Buscar publicaciones" />
            <button id="new-post" class="primary" type="button">＋ Publicar</button>
          </div>
          <div id="feed" class="feed" aria-live="polite">
            <div class="empty">Cargando publicaciones…</div>
          </div>
        </section>
      </main>

      <footer class="footer"><strong>BY OMITO</strong> — AFTER, sin filtros.</footer>
    </div>

    <div id="post-modal" class="modal" aria-hidden="true">
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h2 id="dialog-title">Nueva publicación</h2>
        <p>Comparte una historia con la comunidad AFTER.</p>
        <form id="post-form">
          <label class="field-label">
            Categoría
            <select id="post-category" class="field">
              <option value="influencer">Influencer</option>
              <option value="bartender">Bartender</option>
            </select>
          </label>
          <label class="field-label">
            Título
            <input id="post-title" class="field" maxlength="120" required placeholder="Ej. La noche no se detiene" />
          </label>
          <label class="field-label">
            Publicación
            <textarea id="post-body" class="field" maxlength="3000" required placeholder="Escribe tu historia…"></textarea>
          </label>
          <div class="dialog-actions">
            <button id="cancel-post" class="ghost" type="button">Cancelar</button>
            <button id="publish-post" class="primary" type="submit">Publicar</button>
          </div>
        </form>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      (() => {
        const $ = (selector, root = document) => root.querySelector(selector);
        const feed = $("#feed");
        const modal = $("#post-modal");
        const postForm = $("#post-form");
        const search = $("#search");
        let posts = [];
        let filter = "all";
        let lastFocused = null;
        let toastTimer;

        let visitorId = localStorage.getItem("by_omito_visitor_id");
        if (!visitorId) {
          visitorId = crypto.randomUUID ? crypto.randomUUID() : `visitor-${Date.now()}-${Math.random()}`;
          localStorage.setItem("by_omito_visitor_id", visitorId);
        }

        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
        })[character]);

        const formatDate = (value) => {
          const date = new Date(value);
          return Number.isNaN(date.getTime()) ? "" : date.toLocaleString("es-US", {
            month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
          });
        };

        const showToast = (message) => {
          const toast = $("#toast");
          toast.textContent = message;
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
        };

        const api = async (path, options = {}) => {
          const response = await fetch(path, {
            ...options,
            headers: { "Content-Type": "application/json", ...(options.headers || {}) }
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || data.success === false) throw new Error(data.error || "No se pudo completar la acción.");
          return data;
        };

        const commentsHtml = (comments) => comments.length
          ? comments.map((comment) => `
              <article class="comment">
                <div class="comment-meta">${escapeHtml(comment.name)} <span class="comment-time">· ${formatDate(comment.created_at)}</span></div>
                <p class="comment-text">${escapeHtml(comment.comment)}</p>
              </article>
            `).join("")
          : `<p class="post-type">Todavía no hay comentarios.</p>`;

        const render = () => {
          const query = search.value.trim().toLowerCase();
          const visiblePosts = posts.filter((post) => (
            (filter === "all" || post.category === filter) &&
            `${post.title} ${post.body}`.toLowerCase().includes(query)
          ));

          if (!visiblePosts.length) {
            feed.innerHTML = `<div class="empty">No encontramos publicaciones que coincidan.</div>`;
            return;
          }

          feed.innerHTML = visiblePosts.map((post) => {
            const type = post.category === "bartender" ? "BARTENDER" : "INFLUENCER";
            return `
              <article class="card" data-post-id="${Number(post.id)}">
                <div class="card-head">
                  <div class="avatar" aria-hidden="true">${escapeHtml(post.emoji)}</div>
                  <div><strong>${type}</strong><p class="post-type">BY OMITO · ${formatDate(post.created_at)}</p></div>
                </div>
                <h2 class="post-title">${escapeHtml(post.title)}</h2>
                <p class="post-body">${escapeHtml(post.body)}</p>
                <div class="stats">
                  <button class="action ${post.liked ? "liked" : ""}" type="button" data-like aria-pressed="${Boolean(post.liked)}">♥ Me gusta <span>${Number(post.likes || 0)}</span></button>
                  <button class="action" type="button" data-toggle-comments aria-expanded="false">Comentarios <span>${Number(post.comments || 0)}</span></button>
                </div>
                <section class="comment-box" data-comment-box aria-label="Comentarios de ${escapeHtml(post.title)}">
                  <div class="comments">${commentsHtml(post.commentsList || [])}</div>
                  <div class="comment-row">
                    <textarea class="comment-input" data-comment-input rows="2" maxlength="1000" aria-label="Escribe un comentario" placeholder="Escribe un comentario…"></textarea>
                    <button class="secondary" type="button" data-publish-comment>Enviar</button>
                  </div>
                </section>
              </article>
            `;
          }).join("");
        };

        const loadPosts = async () => {
          try {
            const data = await api(`/api/posts?visitor_id=${encodeURIComponent(visitorId)}`);
            posts = data.posts || [];
            render();
          } catch (error) {
            feed.innerHTML = `<div class="empty">No se pudieron cargar las publicaciones.<br><small>${escapeHtml(error.message)}</small></div>`;
          }
        };

        const openModal = () => {
          lastFocused = document.activeElement;
          modal.classList.add("open");
          modal.setAttribute("aria-hidden", "false");
          setTimeout(() => $("#post-title").focus(), 0);
        };

        const closeModal = () => {
          modal.classList.remove("open");
          modal.setAttribute("aria-hidden", "true");
          if (lastFocused instanceof HTMLElement) lastFocused.focus();
        };

        document.querySelectorAll("[data-filter]").forEach((button) => {
          button.addEventListener("click", () => {
            filter = button.dataset.filter;
            document.querySelectorAll("[data-filter]").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
            render();
          });
        });

        $("#new-post").addEventListener("click", openModal);
        $("#cancel-post").addEventListener("click", closeModal);
        modal.addEventListener("click", (event) => { if (event.target === modal) closeModal(); });
        document.addEventListener("keydown", (event) => { if (event.key === "Escape" && modal.classList.contains("open")) closeModal(); });
        search.addEventListener("input", render);

        feed.addEventListener("click", async (event) => {
          const target = event.target.closest("button");
          if (!target) return;
          const card = target.closest("[data-post-id]");
          const postId = Number(card?.dataset.postId);
          const post = posts.find((item) => Number(item.id) === postId);
          if (!post) return;

          if (target.matches("[data-toggle-comments]")) {
            const box = $("[data-comment-box]", card);
            const isOpen = box.classList.toggle("open");
            target.setAttribute("aria-expanded", String(isOpen));
            if (isOpen) $("[data-comment-input]", card).focus();
            return;
          }

          if (target.matches("[data-like]")) {
            target.disabled = true;
            try {
              const result = await api("/api/like", {
                method: "POST",
                body: JSON.stringify({ post_id: postId, visitor_id: visitorId })
              });
              post.liked = result.liked;
              post.likes = result.likes;
              render();
            } catch (error) {
              showToast(error.message);
              target.disabled = false;
            }
            return;
          }

          if (target.matches("[data-publish-comment]")) {
            const input = $("[data-comment-input]", card);
            const comment = input.value.trim();
            if (!comment) { showToast("Escribe un comentario."); input.focus(); return; }
            target.disabled = true;
            try {
              const name = localStorage.getItem("by_omito_name") || "Invitado";
              const result = await api("/api/comment", {
                method: "POST",
                body: JSON.stringify({ post_id: postId, visitor_id: visitorId, name, comment })
              });
              post.commentsList = result.comments || [];
              post.comments = post.commentsList.length;
              render();
              const refreshed = feed.querySelector(`[data-post-id="${postId}"]`);
              $("[data-comment-box]", refreshed).classList.add("open");
              refreshed.querySelector("[data-toggle-comments]").setAttribute("aria-expanded", "true");
              showToast("Comentario publicado.");
            } catch (error) {
              showToast(error.message);
              target.disabled = false;
            }
          }
        });

        postForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const button = $("#publish-post");
          const title = $("#post-title").value.trim();
          const body = $("#post-body").value.trim();
          if (!title || !body) { showToast("Completa el título y el texto."); return; }
          button.disabled = true;
          try {
            await api("/api/post", {
              method: "POST",
              body: JSON.stringify({ category: $("#post-category").value, title, body })
            });
            postForm.reset();
            closeModal();
            await loadPosts();
            showToast("Publicación creada.");
          } catch (error) {
            showToast(error.message);
          } finally {
            button.disabled = false;
          }
        });

        loadPosts();
      })();
    </script>
  </body>
</html>
